<title>LISTTA — ATENDIMENTOS ESCOLARES</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body>
<header class="top"><div class="brandmark"><div class="logo">L</div><div><div class="brand">LISTTA</div><div class="subtitle">DISTRITO DE EDUCAÇÃO 1</div></div></div><div class="topright"><span id="syncIndicator" class="sync-dot offline" title="OFFLINE"></span><div id="syncLabel">OFFLINE</div></div></header>
<main>
<section id="home" class="screen active">
<div class="hero"><div><span class="eyebrow">PAINEL DE CONTROLE</span><h1>MINHAS ESCOLAS</h1><p>ORGANIZE AS FILAS E ACOMPANHE OS ATENDIMENTOS.</p></div><button class="primary" onclick="openSchoolModal()">＋ NOVA ESCOLA</button></div>
<div class="stats"><div class="stat"><span>ESCOLAS</span><b id="schoolCount">0</b></div><div class="stat"><span>ALUNOS HOJE</span><b id="todayCount">0</b></div><div class="stat"><span>ATENDIDOS</span><b id="doneCount">0</b></div></div>
<div class="searchbox"><span>⌕</span><input id="schoolSearch" placeholder="PESQUISAR ESCOLA..." oninput="renderSchools()"><button class="clear-search" onclick="document.getElementById('schoolSearch').value='';renderSchools()">✕</button></div>
<div id="schoolList" class="cards"></div>
</section>
<section id="school" class="screen"><button class="back" onclick="goHome()">← VOLTAR PARA ESCOLAS</button><div class="school-head"><div><span class="eyebrow">LISTA DE ATENDIMENTO</span><h1 id="schoolTitle">ESCOLA</h1></div><div class="head-actions"><div id="sessionInfo"></div></div></div>
<div class="tabs"><button class="tab active" onclick="setTab('queue',this)">FILA DE ALUNOS</button><button class="tab" onclick="setTab('report',this)">VISUALIZAR RELATÓRIO</button></div>
<div id="queueTab"><div class="queue-tools"><div class="searchbox"><span>⌕</span><input id="personSearch" placeholder="PESQUISAR ALUNO..." oninput="renderPeople()"></div><button class="secondary" onclick="openPersonModal()">＋ ATENDIMENTO</button><button class="secondary import-btn" onclick="openImportModal()">IMPORTAR</button></div><div id="peopleList" class="people"></div></div>
</section>
<section id="reports" class="screen"><div class="hero"><div><span class="eyebrow">VISUALIZADOR</span><h1>RELATÓRIOS GERAIS</h1><p>CONSULTE POR DATA, ESCOLA E TURNO.</p></div><button class="primary" onclick="renderGlobalReport()">ATUALIZAR</button></div>
<section class="report-controls"><div class="searchbox" style="margin:0"><span>📅</span><input type="date" id="reportDate" onchange="renderOldReport()"></div><button class="primary export-old-btn" onclick="exportOldReport()">BAIXAR RELATÓRIO DA DATA</button></section>
<div id="globalReport" class="report"></div>
<div id="oldReport" class="report"></div>
</section>
</main>
<nav class="bottom"><button class="nav active" onclick="showScreen('home',this)">⌂<small>ESCOLAS</small></button><button class="nav" onclick="showScreen('reports',this);renderGlobalReport();renderOldReport()">▤<small>RELATÓRIO</small></button></nav>
<div id="modal" class="modal" hidden><div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">LISTTA</h2><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<!-- local persistence and patches -->
<script src="idb.js"></script>
<script src="patch.js"></script>
<script src="sessions.js"></script>
<script src="app.js"></script>
</body>
</html>
